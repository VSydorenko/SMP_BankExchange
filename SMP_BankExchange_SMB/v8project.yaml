format: DESIGNER
builder: DESIGNER
workPath: 'build'
# Повне завантаження конфігурації в базу агента — довга разова операція:
# base SMBru (58994 файли) не вкладається в шаблонні 600000 мс (10 хв), а SMB
# (24687) з'їдає 4 хв із них. 10 хвилин тут не межа безпеки, а випадкове
# значення шаблону, тому підняте до години. Виміряно 2026-09-10.
execution_timeout: 3600000
infobase:
  connection: 'File=build/ib'
source-set:
  - name: base
    type: CONFIGURATION
    path: 'cf/src'
  - name: SMP_BankExchange_SMB
    type: EXTENSION
    path: 'cfe/src'
  # Тестовий контур YaXUnit (2026-10-12), за зразком SMP_SimplyConnect/SimplyConnect_SMBru.
  # Окреме розширення: тестовий код кличе API рушія YAXUNIT, якого в клієнта немає,
  # тож у постачання йде лише основний .cfe. Прогін: operation=test, testRunner=yaxunit.
  # module передавати БЕЗ префікса `CommonModule.` — з ним YaXUnit 25.12 зациклюється.
  - name: SMP_BankExchange_SMB_Tests
    type: EXTENSION
    path: 'tests/src'
# Тайм-аути прогону тестів (2026-10-14). Ключі є в схемі v8-runner 0.12.3 (tests.execution_timeout_seconds,
# tests.yaxunit.timeouts.*_ms) і приймаються без помилки; чи саме вони задають межу ~300 с на прогін -
# НЕ доведено (див. docs/known-state.md, "Межа ~300 с на один прогін тестів"). Модуль тестів тримати
# помітно нижче ~300 с чистого часу (ознака межі - обрив прогону близько 300 с), а не покладатися на ці значення.
tests:
  execution_timeout_seconds: 1200
  yaxunit:
    timeouts:
      run_ms: 1200000
      total_ms: 1200000
